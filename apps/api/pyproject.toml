[project]
name = "sift-api"
version = "0.1.0"
description = "Sift's FastAPI application."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "supabase>=2.31.0",
  "qdrant-client>=1.19.1",
  "pypdf>=6.19.0",
  "pdf2image>=1.17,<2.0",
  "pytesseract>=0.3.13,<0.4",
  "Pillow>=12.3,<13",
  "python-docx>=1.2.0",
  "inngest>=0.5.19",
  "openai>=1.0,<3.0",
  "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastapi.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true
